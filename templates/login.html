<!DOCTYPE html>
<html>
<head>
    <title>Login HRFlow</title>
    <style>
        body {
            font-family: Arial;
            background: #f3f4f6;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        .logo {
            height: 60px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4F46E5;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="card">

    <img src="{{.logo}}" class="logo">

    <h2>Login</h2>

    <form method="POST" action="/login">
        <input type="text" name="account_code" placeholder="Account Code" required>
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    {{if .error}}
    <p style="color:red">{{.error}}</p>
    {{end}}

</div>

</body>
</html>
