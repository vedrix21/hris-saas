<!DOCTYPE html>
<html>
<head>
    <title>Dashboard HRFlow</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            background: #f3f4f6;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            background: #111827;
            color: white;
            height: 100vh;
            padding: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            padding: 10px;
            color: #d1d5db;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: #374151;
            color: white;
        }

        /* MAIN */
        .main {
            flex: 1;
            padding: 20px;
        }

        /* TOPBAR */
        .topbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .topbar .user {
            font-weight: bold;
        }

        /* CARDS */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin: 0;
            color: #6b7280;
        }

        .card p {
            font-size: 24px;
            font-weight: bold;
        }

    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <img src="{{.logo}}" style="width:120px;">

    <a href="/switch-env/dev">Dev Mode</a>
    <a href="/switch-env/prod">Production Mode</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/employees">Employees</a>
    <a href="/attendance">Attendance</a>
    <a href="/payroll">Payroll</a>
    <a href="/settings">Settings</a>
    <a href="/logout">Logout</a>
</div>

<!-- MAIN -->
<div class="main">

    <!-- TOPBAR -->
    <div class="topbar">
        <h2>Dashboard</h2>
        <div class="user">
            Welcome, {{.tenant}}
        </div>
    </div>

    <!-- CARDS -->
    <div class="cards">

        <div class="card">
            <h3>Total Employees</h3>
            <p>{{.totalEmployee}}</p>
        </div>

        <div class="card">
            <h3>Attendance Today</h3>
            <p>98</p>
        </div>

        <div class="card">
            <h3>Pending Payroll</h3>
            <p>12</p>
        </div>

    </div>

</div>

</body>
</html>
