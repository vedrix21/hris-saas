{{define "sidebar"}}

<div class="sidebar">

    <h2>AitherHR</h2>

    {{range .Menus}}
    <a href="{{.Link}}" class="{{if eq $.CurrentPath .Link}}active{{end}}">
        {{.Name}}
    </a>
    {{end}}

    <form action="/logout" method="POST" style="margin-top:20px;">
        <button type="submit" class="logout-btn">Logout</button>
    </form>

</div>

{{end}}
