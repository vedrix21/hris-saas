{{define "sidebar"}}

<div class="sidebar">

    <h2>AitherHR</h2>

    {{range .Menus}}
        {{if .Children}}
            <!-- Parent Menu -->
            <div class="menu-group">
                <p class="menu-title">{{.Name}}</p>

                {{range .Children}}
                    <a href="{{.Link}}" class="{{if eq $.CurrentPath .Link}}active{{end}}">
                        {{.Name}}
                    </a>
                {{end}}
            </div>

        {{else}}
            <!-- Single Menu -->
            <a href="{{.Link}}" class="{{if eq $.CurrentPath .Link}}active{{end}}">
                {{.Name}}
            </a>
        {{end}}
    {{end}}

    <form action="/logout" method="POST" style="margin-top:20px;">
        <button type="submit" class="logout-btn">Logout</button>
    </form>

</div>

{{end}}
